app:
  name: order-service
  env: development
  debug: true
  version: 1.0.0

http:
  port: 8083

grpc:
  port: 9093

database:
  driver: postgres
  host: postgres
  port: 5432
  name: order_service
  user: postgres
  password: postgres
  sslmode: disable
  maxConnections: 100
  maxIdleConnections: 10
  maxLifetimeConnections: 2

consul:
  host: consul
  port: 8500
  serviceName: order-service
  serviceID: order-service-1

rabbitmq:
  host: rabbitmq
  port: 5672
  user: guest
  password: guest
  vhost: /

vault:
  address: http://vault:8200
  token: root

observability:
  logLevel: debug
  jaegerHost: jaeger
  jaegerPort: 6831
  prometheusPort: 9093

rateLimit:
  requests: 100
  duration: 60

circuitBreaker:
  timeout: 30
  maxFailures: 5

cors:
  allowedOrigins:
    - "*"
  allowedMethods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowedHeaders:
    - Accept
    - Authorization
    - Content-Type
  maxAge: 300

healthCheck:
  port: 8083
  endpoint: /health

features:
  grpcEnabled: true
  tracingEnabled: true
  metricsEnabled: true 